<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Crumbs - Iniciar Sesión</title>
</head>
<body>


    <div class="login-header-bar">
        <h1>Crumbs</h1>
        <p>Tu portal de recetas</p>
    </div>

    <div class="login">
        <div class="login-foto">
            <img src="imagenes/login.png" alt="Recetas">
        </div>
        
        <div class="login-form">
            <h2>Iniciar sesión</h2>
            <input type="text" id="usuario" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">
            <button type="button" id="btnLogin">Entrar</button>
            
            <p id="mensaje"></p>
        </div>
    </div>

    <script type="module" src="./modulos/login.js"></script>
</body>
</html>
